<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        fieldset {
            border: 2px solid black;
            border-radius: 10px;
        }

        legend {
            font-size: 1.2em;
            font-weight: bold;
        }

        input {
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formularios</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Genero</legend>
            <input type="radio" name="genero" id="isxmas"><label for="isxmas">Masculino</label> <br>
            <input type="radio" name="genero" id="isxfem"><label for="isxfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut"> 
            <label for="iesfut">Futebol</label> <br>
            <input type="checkbox" name="esbas" id="iesbas"> 
            <label for="iesbas">Basquete</label> <br>
            <input type="checkbox" name="esvol" id="iesvol">
            <label for="iesvol"> Volei </label><br>
            <input type="checkbox" name="esnata" id="iesnata"> 
            <label for="iesnata">Natação</label> <br>
            <input type="checkbox" name="eskara" id="ieskara"> 
            <label for="ieskara">Karate</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
