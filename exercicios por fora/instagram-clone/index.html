<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram Clone</title>
  <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
  <header>
    <h1>Instagram</h1>
    <nav>
      <a href="#">🏠</a>
      <a href="#">📷</a>
      <a href="#">❤️</a>
      <a href="#">👤</a>
    </nav>
  </header>

  <main>
    <section class="stories">
      <div class="story">👤<span>gustavo</span></div>
      <div class="story">👤<span>ana</span></div>
      <div class="story">👤<span>joao</span></div>
      <div class="story">👤<span>maria</span></div>
    </section>

    <section class="feed">
      <div class="post">
        <div class="post-header">
          <span>gustavo</span>
        </div>
        <img src="imagens/foto-pessoal-pequena-.jpg" alt="foto do post">
        <div class="post-actions">
          ❤️ 💬 📤
        </div>
        <p class="caption"><strong>gustavo</strong> Olha só esse gato 😸</p>
      </div>
    </section>
  </main>
</body>
</html>
